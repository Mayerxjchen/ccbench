schema_version = "1.2"

artifacts = []

[execution]
class = "hpc_controller"

[candidate]
instruction = "instruction.md"
submission_root = "."
legacy_submission_layout = true
files = [{ destination = ".", source = "public/**", strip_prefix = "public" }]

[hpc]
contract_version = "hpc-execution/v1"
required_capabilities = ["batch_jobs", "gpu", "artifact_fetch"]

[hpc.scientific_capabilities]
required = ["ai2kit", "cp2k"]
optional = ["gpu-training"]

[runtime]
requirements = [{ family = "ai2kit", name = "ai2kit", version = "==1.1.0" }]

[task]
name = "benchmark/034-ai2kit-water64-end-to-end-potential"
description = "End-to-end development of a reliable DeePMD water potential (CP2K AIMD -> active learning -> validation) starting from an unrelaxed 64-H2O structure"
authors = []
keywords = ["ai2-kit", "deepmd", "cp2k", "active-learning", "water", "end-to-end", "slurm-workflow"]

[metadata]

[verifier]
timeout_sec = 10800.0

[verifier.env]
AI2KIT_HIDDEN_VALIDATION = "/tests/hidden/dft-validation.extxyz"
AI2KIT_HIDDEN_RDF_REFERENCE = "/tests/hidden/rdf-reference.json"
AI2KIT_NVT_STEPS = "5000"
AI2KIT_NVT_TEMPERATURE = "300"

[environment]
build_timeout_sec = 3600.0
os = "linux"
cpus = 16
memory_mb = 32768
storage_mb = 102400
gpus = 1
allow_internet = false
mcp_servers = []

[environment.env]

[solution]

[solution.env]
