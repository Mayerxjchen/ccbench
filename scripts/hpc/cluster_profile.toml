# cluster_profile.toml - site-specific HPC configuration template.
#
# Copy this file OUTSIDE the repository (it is operator-private), fill in
# every value for YOUR cluster, and pass its path via --profile.  All keys
# are REQUIRED; a missing or wrong-typed key fails fast.
# The SIF path and SHA live in the runtime lock (F3), not here.
#
# COMPUTE-CLASS SEPARATION: partition must name exactly ONE queue.
# Full-GPU and MIG are separate profiles, filled in separately, with
# separate qualifications — never one profile with "gpu,gpu-mig-*".

[ssh]
host = "<site-alias>"          # ssh-config alias of your login node
user = ""                      # empty = take it from ~/.ssh/config
port = 22

[ssh.options]
# Per-invocation -o options (host ssh config is mounted read-only).
BatchMode = "yes"
ConnectTimeout = "10"
IdentitiesOnly = "no"        # use the forwarded agent, not a key path
ControlMaster = "no"         # no control-socket dir inside container
StrictHostKeyChecking = "accept-new"

[paths]
remote_root = "/public/home/<site-user>/dftworld2-runs/matclaw-031"
apptainer = "/path/to/apptainer"
run_suffix = "runs"

[slurm]
account = "acct-blocked"     # DBAccount/SACCT account at your site
partition = "gpu"            # gpu-class queue name at your site
qos = "normal"
gres = "gpu:1"
cpus_per_task = "8"
mem = "64G"                  # per-node memory ceiling for gpu jobs
time_paper = "08:00:00"      # paper-configuration walltime
time_smoke = "00:30:00"      # smoke-configuration walltime
time_probe = "00:30:00"      # probe/dispatch walltime
cpu_partition = "cpu"        # native cpu queue (empty = ACL-era routing)
cpu_cpus_per_task = "8"      # optional; defaults to cpus_per_task
cpu_mem = "8G"               # optional CPU-queue ceiling; defaults to mem
cpu_time_paper = "08:00:00"  # optional; defaults to time_paper
nodes = "1"

[runtime]
expected_node_arch = "x86_64"
sync_strategy = "sync_back"  # rsync back to the site root on settle
lock_dir = "reference/runtime"  # optional; locked <capability>-runtime.lock.json
                                # files the trusted runtime resolver reads
