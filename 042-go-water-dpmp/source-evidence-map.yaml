evidence:
  ev-paper-identity:
    source_id: paper-001
    source_kind: paper
    locator:
      doi: 10.1021/acs.jpclett.5c03713
    claim: paper.title
    note: Title/authors/journal/year from SI header and DOI metadata.

  ev-si-system-construction:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 3
      section: 1.1 Construction of Initial Structures
    claim: system.compositions
    note: GO oxidation levels 12.5%/25%/50%; functional-group counts (144 C base; epoxide+hydroxyl per level).

  ev-si-mlmd-cells:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 5
      section: 1.2 (MLMD simulation)
    claim: system.thermodynamic_conditions
    note: Cell sizes per interface; NVT 300 K, 500 ps, JAX-MD; supercell compositions (576 C, 752 H2O, OH/epoxide per level).

  ev-si-aimd-reference:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 4
      section: 1.2 (reference labeling discussion)
    claim: reference_method
    note: revPBE-D3 functional choice rationale; page 8 records 400 Ry plane-wave cutoff, H mass 2.014 a.u., 1 fs timestep for AIMD acceleration.

  ev-si-datacollection:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 6
      section: 1.3 ML Model Constructions
    claim: dataset.data_generation
    note: Initial 4782 structures (bulk water, air–water, graphene–water); ai2-kit/DP-GEN workflow; stage one 4x DPSR (1e6 steps, LAMMPS exploration, ~6500 structs); stage two 4x DPMP (2e5 steps, JAX-MD, 9358 GO-water structs); convergence >99% below deviation lower bound.

  ev-si-dpmp-arch:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 7
      section: 1.3 ML Model Constructions
    claim: model.architecture
    note: DPMP (JAX) cutoff 6 A, 1e6 steps, lr 1e-3 to 1e-8; embed (48,48,96), MP embed (96,96,96), fit (96,96,96).

  ev-si-dpsr-arch:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 7
      section: 1.3 ML Model Constructions
    claim: model.related_models.architecture
    note: DPSR (tensorflow) embed (25,50,100), fit (240,240,240).

  ev-si-model-validation:
    source_id: si-001
    source_kind: supporting_information
    locator:
      page: 7
      section: 1.4 ML Model Validations
    claim: validation
    note: Random 100 structures per GO-water kind from training data as test; force RMSE/R^2; DPMP lower RMSE than DPSR; DPMP used for production MD and SFG spectra.

