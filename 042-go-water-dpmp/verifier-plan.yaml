# Case 042 verifier plan — MLP layers + fixtures
# end_to_end_model_development: V0/V1/V2/V4 mandatory.
# iterative_improvement is required by the paper's ai2-kit workflow, and the
# end-to-end capability mapping makes hidden_dynamic_stability and
# hidden_physical_observable hard outcomes -> V3/V5/V6 are also mandatory here.
schema_version: 1
category: mlp
layers:
  - layer: MLP-V0
    mandatory: true
    outcome: system/submission identity (case files, type_map, submission root)
  - layer: MLP-V1
    mandatory: true
    outcome: data/label provenance (AIMD labeling records, per-datum provenance)
  - layer: MLP-V2
    mandatory: true
    outcome: model authenticity (trained DPMP model is real, reproducible, loadable)
  - layer: MLP-V3
    mandatory: true
    outcome: iterative workflow integrity (active-learning explore/select/label/retrain lineage)
  - layer: MLP-V4
    mandatory: true
    outcome: hidden static accuracy (energy/force RMSE on hidden held-out frames)
  - layer: MLP-V5
    mandatory: true
    outcome: hidden dynamic stability (short NVT, no collapse/unphysical behavior)
  - layer: MLP-V6
    mandatory: true
    outcome: hidden physical observable (water density profile across GO–water interface)
fixtures:
  positive:
    - path: tests/fixtures/positive/
      note: expert reference run artifacts (real pipeline evidence)
  negative:
    - path: tests/fixtures/negative/
      note: one per hard outcome; e.g. missing provenance, wrong model, collapsed NVT, threshold miss
  alternative_valid:
    - path: tests/fixtures/alternative-valid/
      note: outcome-based alternative pipeline (e.g. different labeling schedule that still reaches hidden thresholds)
