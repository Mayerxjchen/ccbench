# Case 042 required platform / HPC contract.
#
# Mirrors the [hpc] block of task.toml: the case needs a real batch scheduler
# with GPU nodes and artifact fetch. The concrete site (queue, account) is
# chosen by the site operator's site-config; this file declares what 042
# requires of any eligible platform.
contract_version: hpc-execution/v1
name: gpu-slurm
architecture: linux/amd64
default_queue: gpu
gpus: 1
required_capabilities:
  - batch_jobs
  - gpu
  - artifact_fetch
# Scientific compute capabilities the HPC must provide vs may provide.
# CP2K is required (DFT labeling / AIMD, fixed by the paper). DPMP training and
# long JAX-MD offload are optional/discoverable — Discovery decides placement.
scientific_capabilities:
  required:
    - cp2k
  optional:
    - gpu-training
    - jax-md-gpu
