schema_version: 1

blocked_kinds:
  SOURCE_BLOCKED:
    meaning: Public evidence cannot support the declared scientific target.
    decision: REJECT
  INFRA_INVALID:
    meaning: Sandbox, gateway, scheduler, isolation, recovery, or evidence infrastructure failed.
    decision: REFINE
  CASE_DESIGN_BLOCKED:
    meaning: Prompt, public inputs, hidden scope, verifier, or artifact contracts disagree.
    decision: REFINE
  RUNTIME_BLOCKED:
    meaning: The declared scientific software stack cannot execute in the resolved runtime.
    decision: REFINE
  RESOURCE_BLOCKED:
    meaning: The bounded workflow cannot run within the available compute resources.
    decision: REFINE
  AGENT_LIMITATION:
    meaning: The case and infrastructure are sound, but the Agent did not complete the scientific objective.
    decision: PROMOTE

decisions:
  PROMOTE:
    next: Invest in bounded expert reference, calibration, hidden-verifier closure, and reruns.
  REFINE:
    next: Repair the named blocker and repeat Discovery before reference investment.
  REJECT:
    next: Archive or rescope the case when public evidence cannot support the target.

decision_priority:
  - SOURCE_BLOCKED
  - INFRA_INVALID
  - CASE_DESIGN_BLOCKED
  - RUNTIME_BLOCKED
  - RESOURCE_BLOCKED
  - AGENT_LIMITATION
