# Canonical v2 case manifest. init_case.py renders [execution] (and the [hpc]
# block for hpc_controller cases) from the validated design; the candidate
# file rules keep the public/ prefix (destination "." preserves the source
# layout) so instruction paths match the packaged bundle byte-for-byte.
# Fill [task] name/title and refine rules per case.
schema_version = 1

[task]
name = "draft-case"
title = "draft task"

[execution]
class = "local_sandbox"

[candidate]
instruction = "instruction.md"
submission_root = "."
legacy_submission_layout = false
files = [
  { source = "public/**", destination = "." },
]
