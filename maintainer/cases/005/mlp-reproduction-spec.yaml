# MLIP Reproduction Specification — Case 042 GO–water DPMP
# Evidence-backed extraction. Bookkeeping only; no scientific adequacy claim.
schema_version: 1

paper:
  title:
    value: Machine-Learning Accelerated Computational Spectroscopy Reveals Vibrational Signature of the Oxidation Level of Graphene in Contact with Water
    claim_status: observed
    evidence: [ev-paper-identity]
  doi:
    value: 10.1021/acs.jpclett.5c03713
    claim_status: observed
    evidence: [ev-paper-identity]
  journal:
    value: The Journal of Physical Chemistry Letters
    claim_status: observed
    evidence: [ev-paper-identity]
  year:
    value: 2026
    claim_status: observed
    evidence: [ev-paper-identity]
  authors:
    value: [Xianglong Du, Jun Cheng, Fujie Tang]
    claim_status: observed
    evidence: [ev-paper-identity]
  source_id: paper-001

reproduction_scope:
  target: full_data_generation_and_training
  case_kind: end_to_end_model_development
  includes:
    - initial structure construction (SI 1.1)
    - DFT reference labeling (revPBE-D3 / CP2K)
    - active-learning data collection (ai2-kit / DP-GEN workflow)
    - final DPMP model training (JAX, 1e6 steps)
    - model-level verification (hidden static accuracy)
  excludes:
    - downstream spectroscopy (SFG spectra, H-bond lifetime, density profile)
    - production MLMD trajectory analysis
  interpretation:
    claim_status: inferred
    evidence: [ev-si-datacollection]
    note: Published 14140-frame dataset already embodies the full generation pipeline; design stage decides how much data generation the candidate must re-execute versus consume the published artifact.

target:
  primary:
    reported_name: DPMP model
    model_family: deep_potential
    variant: message_passing
    role: production
    intended_use: production MD and SFG spectra for GO–water interfaces
    evidence: [ev-si-dpmp-arch, ev-config-trainpy, ev-si-model-validation]
  related_models:
    - reported_name: DPSR model
      model_family: deep_potential
      variant: short_range
      role: data_generation
      required_for_scope: true
      evidence: [ev-si-dpsr-arch, ev-si-datacollection]

system:
  elements:
    value: [O, H, C]
    claim_status: observed
    evidence: [ev-dataset-elements]
  compositions:
    value: GO–water at 12.5%/25%/50% oxidation; bulk water; air–water; graphene–water
    claim_status: observed
    evidence: [ev-si-system-construction, ev-si-mlmd-cells]
  interfaces:
    - bulk_water
    - air_water
    - graphene_water
    - go_water
  charge_states:
    value: null
    claim_status: unknown
    evidence: []
  thermodynamic_conditions:
    value: NVT 300 K (production MLMD, 500 ps); exploration at 300/330/360 K NVT and NPT in early stage
    claim_status: observed
    evidence: [ev-si-mlmd-cells, ev-si-datacollection]

dataset:
  scientific_scope:
    systems: [water, air-water, air-water-long, graphene-water, graphene-water-long, graphene-O12, graphene-O25, graphene-O50]
    generation_summary: ai2-kit/DP-GEN active-learning workflow; 4782 initial + 9358 GO–water structures
  inventory:
    total_frames:
      value: 14140
      claim_status: derived
      evidence: [ev-dataset-inventory, ev-si-datacollection]
    components:
      - system: water
        frames: 1630
      - system: air-water
        frames: 1350
      - system: air-water-long
        frames: 400
      - system: graphene-water
        frames: 848
      - system: graphene-water-long
        frames: 554
      - system: graphene-O12
        frames: 1343
      - system: graphene-O25
        frames: 4515
      - system: graphene-O50
        frames: 3500
  splits:
    training:
      value: all 8 published systems (train.py val_data_path=None)
      claim_status: observed
      evidence: [ev-config-trainpy]
    validation:
      value: null
      claim_status: unknown
      evidence: []
    test:
      value: "paper-internal: 100 random structures per GO–water kind from training set"
      claim_status: observed
      evidence: [ev-si-model-validation]
  artifact:
    source_id: dataset-001
    format:
      value: deepmd_raw
      claim_status: observed
      evidence: [ev-dataset-rawformat]
    manifest: set.000/{coord,force,energy,box}.npy + type.raw + type_map.raw per system
    paths:
      - GO–water interfaces/source_data/train_dataset/<system>/set.000/
    content_hash:
      tree_sha256: f6a72245de8275e3c5dbc166b9c983776736f8d05e58956cc15cc4b4f9917d73
  data_generation:
    required_for_scope: true
    method: ai2-kit / DP-GEN active learning
    active_learning:
      value: stage one 4x DPSR (1e6 steps, LAMMPS exploration, deviation bounds 0.60/0.20 eV/A); stage two 4x DPMP (2e5 steps, JAX-MD exploration, NVT, >99% below lower bound)
      claim_status: observed
      evidence: [ev-si-datacollection]

labels:
  energy:
    present: true
    unit: eV
    claim_status: observed
    evidence: [ev-config-trainpy, ev-dataset-rawformat]
  forces:
