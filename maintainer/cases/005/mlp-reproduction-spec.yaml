    claim_status: observed
    evidence: [ev-si-dpmp-arch]
  architecture:
    cutoff:
      value: 6.0
      unit: angstrom
      claim_status: observed
      evidence: [ev-si-dpmp-arch, ev-config-trainpy]
    parameters:
      value:
        model_type: energy
        mp: true
        embed_widths: [48, 48, 96]
        embed_mp_widths: [96, 96, 96]
        fit_widths: [96, 96, 96]
        axis_neurons: 16
        compress: true
      claim_status: observed
      evidence: [ev-si-dpmp-arch, ev-config-trainpy]
  precision:
    value: null
    claim_status: unknown
    evidence: []
  initialization:
