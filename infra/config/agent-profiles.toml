# Agent profiles: budget and timing limits for different run types.
# These are infrastructure-owned; cases never reference them directly.
#
# 字段说明（所有 profile 共用同一组字段）：
#   max_model_turns           —— 单次运行中 agent 允许的最大模型对话轮数。
#   max_total_tokens          —— 单次运行的 token 总量预算上限（input+output 合计）。
#   agent_active_walltime_sec —— agent 实际执行（推理/工具调用）的挂钟时间上限，不含排队等待。
#   scheduler_wait_walltime_sec —— 在调度队列中等待资源/排队的挂墙时间上限；0 表示不排队（本地即起即用）。
#
# 通用换算：7200s=2h，43200s=12h，86400s=1d，172800s=2d，604800s=7d。

# 基础/试点配置：常规基础设施任务，2h 活跃时长，2d 内完成调度排队即可。
[agents.pilot-infra]
max_model_turns = 128
max_total_tokens = 25000000
agent_active_walltime_sec = 7200
scheduler_wait_walltime_sec = 172800

# 发现/长探索配置：用于较长周期的探索性任务，12h 活跃时长，一周内完成调度即可。
[agents.discovery-long]
max_model_turns = 256
max_total_tokens = 50000000
agent_active_walltime_sec = 43200
scheduler_wait_walltime_sec = 604800

# 正式/长周期配置：最高预算与最长时长，用于正式、大规模或关键路径任务，1d 活跃时长。
[agents.formal-long]
max_model_turns = 512
max_total_tokens = 100000000
agent_active_walltime_sec = 86400
scheduler_wait_walltime_sec = 604800

# 本地标准配置：本地环境运行，无调度排队（0），轮数与预算最小，适合轻量、即时任务。
[agents.local-standard]
max_model_turns = 64
max_total_tokens = 10000000
agent_active_walltime_sec = 7200
scheduler_wait_walltime_sec = 0
