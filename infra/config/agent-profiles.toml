[agents.claude-mvp]
runner = "container_claude_code"
command = ["claude"]
image = "bench-agent-claude-code:2.1.266"
sidecar_image = "bench-gateway-anthropic:1"
# Generated by scripts/infra/qualify_candidate_runtimes.py on each host.
# Formal runs load and verify these signed locks; local runs may omit them.
candidate_runtime_lock = "~/.config/bench/qualifications/candidate.lock.json"
sidecar_runtime_lock = "~/.config/bench/qualifications/sidecar.lock.json"
model = "claude-sonnet-4-6"
effort = "medium"
max_turns = 64
max_budget_usd = 5.0
agent_timeout_sec = 7200
preflight_timeout_sec = 20
# Hard deadline for one upstream model response. It prevents a stalled route
# from holding Candidate and Sidecar containers for the full agent walltime.
upstream_response_timeout_sec = 300
max_total_tokens = 50000000
tools = ["Bash", "Read", "Write", "Edit", "Glob", "Grep"]
api_endpoint_env = "ANTHROPIC_BASE_URL"
api_key_env = "ANTHROPIC_API_KEY"
allowed_skills = ["bench-compute-request"]
tool_policy = "infra/config/tool-policy.json"
transcript_format = "jsonl"


[verifiers.matclaw-cips-v1]
image = "bench-runtime-deepmd-kit:2.2.11-cpu"
runtime_lock = "runtimes/locks/matclaw-cips-verifier.lock.json"
tmpfs = "/tmp:rw,noexec,nosuid,size=512m"
cpus = 4.0
memory = "8g"
pids_limit = 512

[verifiers.ai2kit-v1]
image = "ai2kit-runtime-v1"
runtime_lock = "runtimes/locks/ai2kit-runtime.lock.json"
tmpfs = "/tmp:rw,noexec,nosuid,size=512m"
cpus = 4.0
memory = "8g"
pids_limit = 512

[verifiers.dpmp-v1]
image = "bench-runtime-deepmd-jax:0.2-cpu"
runtime_lock = "runtimes/locks/deepmd-jax-verifier.lock.json"
tmpfs = "/tmp:rw,noexec,nosuid,size=512m"
cpus = 4.0
memory = "8g"
pids_limit = 512
