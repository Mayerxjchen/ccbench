# API profiles: endpoint and retry configuration.
# Secrets are resolved from environment variables, never committed.

[api.default]
endpoint_env = "DFTWORLD_API_ENDPOINT"
credential_env = "DFTWORLD_API_KEY"
max_retries = 3
retry_base_delay_sec = 1.0
retry_max_delay_sec = 30.0
request_timeout_sec = 120.0
# Frozen conservative ceiling used when resolving the per-run cost budget.
cost_usd_micros_per_token = 1
