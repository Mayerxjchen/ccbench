# MLFFBench HPC Qualification Trust Store
# Public keys authorized to certify site and compute profile qualifications.
# Private keys MUST NEVER be committed to this repository or exposed to agents.

schema_version = 1

# Production signing key for CompShare site qualification (unconfigured in repository).
# In production, maintainer configures this via local or injected trusted policy.
# When unconfigured, qualification verifier returns NOT_CONFIGURED and fails closed.
[keys.compshare-site-v1]
algorithm = "ed25519"
public_key_hex = ""
status = "UNCONFIGURED"
purpose = "compshare-site-qualification"

# Independent Layer-2 ComputeProfile signing anchor.  Deliberately
# UNCONFIGURED in the repository: an operator must inject the maintainer's
# public key through trusted deployment configuration before v2 qualification
# can pass.
[keys.compute-profile-v2]
algorithm = "ed25519"
public_key_hex = ""
status = "UNCONFIGURED"
purpose = "compute-profile-qualification"

# Independent Candidate Agent signing anchor for MLFFBench.
[keys.candidate-agent-v1]
algorithm = "ed25519"
public_key_hex = "39afce400b85bdc2675671f0a388d6078bde32fb421ce3c995fb0d4eac2a8e1f"
status = "ACTIVE"
purpose = "candidate-agent-qualification"
