schema_version = "1.2"
case_version = "1.0.0"

[execution]
class = "local_sandbox"

[candidate]
instruction = "task.md"
submission_root = "final"
legacy_submission_layout = false
runner = "container_claude_code"
files = [{ destination = ".", source = "input/**", strip_prefix = "input" }]

[agent]
profile = "claude-mvp"
skills = ["bench-compute-request"]

[compute]
classes = ["cpu", "gpu"]
required_capabilities = ["ai2kit", "cp2k"]
optional_capabilities = ["gpu-training"]

[runtime]
requirements = [
  { family = "ai2kit", name = "ai2kit", version = "==1.1.0" },
  { family = "cp2k", name = "cp2k", version = "==2025.2" },
]

[task]
name = "benchmark/004-ai2kit-water64-end-to-end-potential"
description = "End-to-end development of a reliable DeePMD water potential (CP2K AIMD -> active learning -> validation) starting from an unrelaxed 64-H2O structure"

[verifier]
profile = "ai2kit-v1"
timeout_sec = 10800

[coverage]
scientific_domain = "water_liquid"
method_family = "end_to_end_potential"
material_class = "molecular_liquid"
computation_type = "end_to_end_pipeline"

[environment]
cpus = 16
memory_mb = 32768
storage_mb = 102400
gpus = 0
allow_internet = false
