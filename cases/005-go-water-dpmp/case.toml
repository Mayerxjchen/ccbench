schema_version = "1.2"
case_version = "1.0.0"

[execution]
class = "hpc_controller"

[candidate]
instruction = "task.md"
submission_root = "final"
legacy_submission_layout = false
image = "dftworld-base-deepmd-jax"
files = [{ destination = ".", source = "input/**", strip_prefix = "input" }]

[hpc]
contract_version = "hpc-execution/v1"
required_capabilities = ["batch_jobs", "gpu", "artifact_fetch"]

[hpc.qualification]
requires = ["dispatcher.cpu", "dispatcher.gpu", "runtime.cp2k", "runtime.jax"]

[hpc.scientific_capabilities]
required = ["cp2k", "deepmd-jax"]
optional = ["gpu-training", "jax-md-gpu"]

[runtime]
requirements = [{ family = "deepmd-jax", name = "dpmp", version = "==0.2.1" }]

[task]
name = "benchmark/005-go-water-dpmp"
title = "End-to-end development of a GO–water DPMP interatomic potential"
description = "Reproduce the full development pipeline of the DPMP potential for GO–water interfaces: CP2K revPBE-D3 AIMD labeling, DPMP training on JAX, iterative active-learning improvement, hidden static/dynamic/physical validation. Published dataset and author model are hidden references."

[verifier]
timeout_sec = 10800

[coverage]
scientific_domain = "water_oxide_interface"
method_family = "end_to_end_potential"
material_class = "oxide_interface"
computation_type = "end_to_end_pipeline"

[environment]
cpus = 16
memory_mb = 32768
storage_mb = 102400
gpus = 0
allow_internet = false
