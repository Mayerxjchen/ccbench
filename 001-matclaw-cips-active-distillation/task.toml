schema_version = "1.2"

artifacts = []

[execution]
class = "hpc_controller"

[candidate]
instruction = "instruction.md"
submission_root = "."
legacy_submission_layout = true
files = [{ destination = ".", source = "public/**", strip_prefix = "public" }]

[hpc]
contract_version = "hpc-execution/v1"
required_capabilities = ["batch_jobs", "gpu", "artifact_fetch"]

[hpc.qualification]
requires = ["dispatcher.gpu", "runtime.matclaw-gpu"]

[hpc.scientific_capabilities]
required = ["matclaw-cips", "cp2k"]
optional = ["gpu-training"]

[runtime]
requirements = [{ family = "matclaw-cips", name = "matclaw-cips", version = "==2.2.11" }]

[task]
name = "benchmark/001-matclaw-cips-active-distillation"
description = "Active distillation of a fast CIPS DeePMD potential"
authors = []
keywords = ["matclaw", "deepmd", "active-learning", "cips"]

[metadata]

[verifier]
timeout_sec = 7200.0

[verifier.env]
MATCLAW_PROFILE = "paper"

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 8
memory_mb = 16384
storage_mb = 51200
gpus = 1
allow_internet = false
mcp_servers = []

[environment.env]

[solution]

[solution.env]
MATCLAW_PROFILE = "paper"
