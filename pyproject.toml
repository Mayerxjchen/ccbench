[project]
name = "bench"
version = "0.1.0"
description = "AI agent benchmark for computational chemistry tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pypdf>=6.15.0",
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "zstandard>=0.23,<1",
]
hpc = [
    "compshare-cli==0.4.1",
    # compshare-cli 0.4.1 imports Typer's pre-0.17 Click compatibility API.
    "typer==0.16.1",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
# testpaths restricts collection to the real suite, so root-level data dirs
# (jobs/, evidence/, .worktrees/) and case-internal test trees are never
# reached.  norecursedirs keeps future data dirs under tests/ out too.
testpaths = ["tests"]
norecursedirs = ["jobs", ".worktrees", ".pagent"]
markers = [
    "container: marks tests requiring pre-built container images or docker daemon",
    "live: marks tests requiring external live clusters or cloud credentials",
]
