name: Bench CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    env:
      BENCH_OFFLINE: "1"
      BENCH_API_KEY: "ci-mock-disabled"
      BENCH_BASE_URL: "http://127.0.0.1:9"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project dependencies
        run: uv sync --frozen --extra dev

      - name: Verify CLI entry point and packaging
        run: |
          uv run bench --help
          uv run bench setup --report-only

      - name: Run verification suite
        run: |
          uv run pytest tests/ -m "not container and not live" -q
