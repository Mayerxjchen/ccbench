name: CCBench CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    env:
      CCBENCH_OFFLINE: "1"
      DEEPSEEK_API_KEY: "ci-mock-disabled"
      DEEPSEEK_BASE_URL: "http://127.0.0.1:9"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync --frozen || uv sync

      - name: Run verification suite
        run: |
          uv run pytest tests/ -q

      - name: Verify release provenance & digest integrity
        run: |
          uv run python3 scripts/ablation/build_release.py --verify
