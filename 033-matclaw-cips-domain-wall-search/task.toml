schema_version = "1.2"

artifacts = []

[execution]
class = "hpc_controller"

[candidate]
instruction = "instruction.md"
submission_root = "."
legacy_submission_layout = true
files = [{ destination = ".", source = "public/**", strip_prefix = "public" }]

[hpc]
contract_version = "hpc-execution/v1"
required_capabilities = ["batch_jobs", "gpu", "artifact_fetch"]
# Capability-matrix gates (spec §5b): the site receipt must derive PASS for
# every name before this case may run formally.  dispatcher.gpu is explicit
# (dispatcher tiers are never auto-derived); runtime.matclaw-gpu is declared
# too, so the gate survives even if the matclaw-cips registry mapping changes.

[hpc.qualification]
requires = ["dispatcher.gpu", "runtime.matclaw-gpu"]

[hpc.scientific_capabilities]
required = ["matclaw-cips", "cp2k"]
optional = ["gpu-training"]

[runtime]
requirements = [{ family = "matclaw-cips", name = "matclaw-cips", version = "==2.2.11" }]

[task]
name = "benchmark/033-matclaw-cips-domain-wall-search"
description = "Adaptive electric-field/temperature search for CIPS domain-wall propagation"
authors = []
keywords = ["matclaw", "deepmd", "adaptive-search", "domain-wall"]

[metadata]

[verifier]
timeout_sec = 7200.0

[verifier.env]
MATCLAW_PROFILE = "paper"

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 8
memory_mb = 16384
storage_mb = 51200
gpus = 1
allow_internet = false
mcp_servers = []

[environment.env]

[solution]

[solution.env]
MATCLAW_PROFILE = "paper"
