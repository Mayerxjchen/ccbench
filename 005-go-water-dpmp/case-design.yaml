# Case 042 design — GO–water DPMP end-to-end
# Execution class: hpc_controller (Agent = control layer; batch jobs on GPU/CPU nodes)
# Case kind: end_to_end_model_development -> reproduction_scope.full_data_generation_and_training
schema_version: 1
category: mlp
case_kind: end_to_end_model_development
execution:
  class: hpc_controller
objective: >
  Reproduce the Deep Potential Message Passing (DPMP) interatomic potential for
  graphene-oxide/water interfaces from scratch: construct the initial structures,
  generate first-principles labels with CP2K (revPBE-D3) AIMD, train a DPMP model,
  iteratively improve it through active learning, and verify hidden static accuracy,
  dynamic stability, and physical observables. The published 14140-frame labeled
  dataset and the author's model.pkl are withheld as hidden verification references;
  the Agent must produce its own labeled data and trained model.
identity:
  case_id: 042-go-water-dpmp
  task_name: benchmark/042-go-water-dpmp
  title: End-to-end development of a GO–water DPMP interatomic potential
  description: "Reproduce the full development pipeline of the DPMP potential for GO–water interfaces: CP2K revPBE-D3 AIMD labeling, DPMP training on JAX, iterative active-learning improvement, hidden static/dynamic/physical validation. Published dataset and author model are hidden references."
  case_version: 1.0.0
runtime:
  candidate_image: dftworld-base-deepmd-jax
  build_timeout_sec: 3600
  agent_timeout_sec: 86400
  verifier_timeout_sec: 10800
  cpus: 16
  memory_mb: 32768
  storage_mb: 102400
  # Sandbox is the control layer: no local accelerator. GPU lives on the HPC
  # side as a compute capability (hpc.scientific_capabilities.optional), which
  # the agent requests through the gateway. A local --gpus would not start on
  # GPU-less hosts (Apple M4 has no NVIDIA runtime).
  gpus: 0
  allow_internet: false
hpc:
  contract_version: hpc-execution/v1
  # platform capabilities (scheduler / accelerator / output fetch) — the
  # candidate is a control layer that requests these through the trusted gateway.
  required_capabilities:
    - batch_jobs
    - gpu
    - artifact_fetch
  # scientific compute capabilities: which heavy work must/may run on HPC.
  # CP2K is fixed by the paper (DFT labeling + AIMD). DPMP training / long JAX-MD
  # placement is NOT fixed by the SI — Discovery decides; do not pre-hardcode.
  scientific_capabilities:
    required:
      - cp2k
    optional:
      - gpu-training
      - jax-md-gpu
submission:
  root: final
candidate_visible:
  - public
  - instruction.md
candidate_files:
  - source: public/**
    destination: .
    strip_prefix: public
