schema_version: 1
paper:
  title: "MatClaw: An Autonomous Code-First LLM Agent for End-to-End Materials Exploration"
  arxiv: "2604.02688v3"
  year: 2026
  source_id: matclaw-paper
  evidence: [ev-paper-method]
reproduction_scope:
  target: full_data_generation_and_training
  includes:
    - supplied published teacher inference for labels
    - periodic teacher MD data generation
    - committee student DeePMD training
    - active explore/select/teacher-label/grow/retrain cycle
    - independent held-out static evaluation
  excludes:
    - Curie-temperature calculation
    - electric-field domain-wall search
  interpretation:
    claim_status: inferred
    evidence: [ev-paper-method, ev-task1-lineage]
target:
  primary:
    reported_name: final CIPS student selected by held-out force error
    model_family: DeePMD
    variant: committee member selected after active rounds
    role: student
    intended_use: CIPS periodic MD after held-out static validation
    evidence: [ev-task1-lineage]
  related_models:
    - reported_name: published CIPS teacher vdW_CuInP2S6_optB86b
      model_family: DeePMD
      variant: frozen_model.pb
      role: teacher
      required_for_scope: true
      evidence: [ev-teacher-identity, ev-teacher-map]
    - reported_name: independent student committee members
      model_family: DeePMD
      variant: independently seeded replicas
      role: committee
      required_for_scope: true
      evidence: [ev-paper-method]
system:
  elements: [Cu, In, P, S]
  compositions:
    - {formula: Cu9In9P18S54, cell: "3x3x1 supplied periodic CuInP2S6 supercell", natoms: 90}
  phases: [layered CIPS, phase not restricted for teacher MD]
  interfaces: []
  charge_states: [0]
  spin_states: [{value: unspecified, claim_status: unknown, evidence: []}]
  thermodynamic_conditions:
    boundary_conditions: periodic
    temperatures: "at least two distinct training temperatures plus a separate held-out temperature"
  chemical_scope: [bulk_CuInP2S6]
dataset:
  scientific_scope:
    systems: [cips_bulk_3x3x1]
    generation_summary: teacher-labelled periodic MD configurations; generated anew by Candidate
  inventory:
    total_frames: {value: null, claim_status: unknown, evidence: []}
    components:
      - name: initial_teacher_training
        count: {value: null, claim_status: unknown, evidence: []}
      - name: held_out_teacher_trajectory
        count: {value: null, claim_status: unknown, evidence: []}
      - name: active_selected_labels
        count: {value: null, claim_status: unknown, evidence: []}
  splits:
    training: independent teacher-labelled frames from initial and selected sets
    validation: optional training-only validation split, never the held-out trajectory
    test: separate teacher-labelled trajectory with distinct seed and trajectory identity
  artifact:
    source_id: task1-workspace
    format: DeePMD/npy or an equivalent auditable frame format
    manifest: final/manifest.json (Candidate output contract)
    paths: [final/data, final/workflow]
    content_hash: null
  data_generation:
    required_for_scope: true
    method: teacher-model MD followed by explicit frame provenance and finite-value checks
    active_learning: explore/select/teacher-label/grow/retrain, at least one completed round
labels:
  energy: {present: true, unit: eV, claim_status: observed, evidence: [ev-task1-lineage]}
  forces: {present: true, unit: eV/angstrom, claim_status: observed, evidence: [ev-task1-lineage]}
  virial: {present: true, unit: eV, claim_status: observed, evidence: [ev-teacher-identity]}
  stress: {present: null, claim_status: unknown, evidence: []}
  charges: {present: false, unit: e, claim_status: observed, evidence: [ev-teacher-map]}
  dipoles: {present: null, claim_status: unknown, evidence: []}
  other: []
reference_method:
  software: DeePMD-kit teacher inference
  version: {value: 2.2.11, unit: release, claim_status: observed, evidence: [ev-runtime]}
  theory_level: teacher potential (not an electronic-structure label)
  xc_functional: {value: null, claim_status: unknown, evidence: []}
  dispersion: {value: null, claim_status: unknown, evidence: []}
  basis: {value: null, claim_status: unknown, evidence: []}
  pseudopotential: {value: null, claim_status: unknown, evidence: []}
  plane_wave_cutoff: {value: null, claim_status: unknown, evidence: []}
  k_points: {value: null, claim_status: unknown, evidence: []}
  charge: {value: 0, unit: e, claim_status: inferred, evidence: [ev-structure]}
  spin: {value: null, claim_status: unknown, evidence: []}
  scf: {value: null, claim_status: unknown, evidence: []}
  smearing: {value: null, claim_status: unknown, evidence: []}
  convergence: {value: null, claim_status: unknown, evidence: []}
  corrections: {value: null, claim_status: unknown, evidence: []}
  evidence: [ev-teacher-identity, ev-runtime]
implementation:
  framework: DeePMD-kit
  backend: TensorFlow graph inference/training runtime
  version: {value: null, claim_status: unknown, evidence: [ev-runtime]}
  repository: https://github.com/deepmodeling/deepmd-kit
  commit: null
  release: {value: 2.2.11, claim_status: observed, evidence: [ev-runtime]}
  fork: null
  entrypoint: dp train / dp test / DeePMD-compatible MD driver
  environment: teacher runtime lock is recovered; student runtime/site identity must be recorded by Candidate
  evidence: [ev-runtime]
model:
  family: DeePMD
  variant: model-deviation committee of independently seeded students
  architecture:
    cutoff: {value: null, unit: angstrom, claim_status: unknown, evidence: []}
    parameters: {committee_size: "at least 2", seed_policy: distinct deterministic seeds}
  precision: {value: null, claim_status: unknown, evidence: []}
  initialization: student training from teacher-labelled data; exact initialization is Candidate-recorded
  evidence: [ev-paper-method, ev-task1-lineage]
training:
  objective: joint energy and force regression to teacher labels
  data_binding:
    train_systems: [cips_bulk_3x3x1]
    held_out_excluded: true
  steps: {value: null, claim_status: unknown, evidence: []}
  epochs: {value: null, claim_status: unknown, evidence: []}
  batch_size: {value: null, claim_status: unknown, evidence: []}
  optimizer: {value: null, claim_status: unknown, evidence: []}
  learning_rate: {value: null, claim_status: unknown, evidence: []}
  loss_weights: {value: null, claim_status: unknown, evidence: []}
  seed: {value: null, claim_status: unknown, evidence: []}
  active_learning:
    max_iterations: 5
    min_iterations: 1
    selection: uncertainty band or equivalent documented uncertainty rule; reject nonfinite/pathological frames
    convergence: held-out force MAE <= 0.10 eV/angstrom after min_iterations
    evidence: [ev-paper-method, ev-task1-lineage]
validation:
  model_level:
    status: recoverable
    dataset_or_split: independent teacher-labelled trajectory generated with distinct seed
    split: trajectory-level, no adjacent-frame random split
    metrics: [force_mae_eV_per_angstrom, force_rmse_eV_per_angstrom, energy_mae_eV_per_atom]
    procedure: independent parser recomputes metrics from fetched teacher labels and student predictions
    reference_values: draft target force_mae <= 0.10 eV/angstrom; numeric calibration pending
  workflow:
    required: [teacher_md, committee_train, committee_explore, uncertainty_select, teacher_label, dataset_growth, committee_retrain]
    observable: active_iterations and complete lineage manifest
access:
  dataset: {status: available, source: recovered teacher-labelled source ecosystem; Candidate must generate new frames}
  pretrained_model: {status: available, source: public/teacher/frozen_model.pb}
  source_repository: {status: available, source: local recovered source package}
licenses:
  code: {license: unknown, source: matclaw-release}
  dataset: {license: unknown, source: teacher-model}
  model: {license: unknown, source: teacher-model}
