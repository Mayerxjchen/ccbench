schema_version: 1
scope: full_data_generation_and_training
missing:
  - field: training.steps
    critical_for: [execution_readiness]
    recovery: record and freeze a student training configuration during Discovery
  - field: model.architecture.cutoff
    critical_for: [execution_readiness, verification_readiness]
    recovery: inspect version-matched teacher/student configurations during Discovery
  - field: validation.thresholds
    critical_for: [verification_readiness]
    recovery: run independent reference calibration before formal Agent results are inspected
  - field: execution.site_receipt
    critical_for: [execution_readiness]
    recovery: qualify dispatcher, GPU runtime, scheduler, and artifact-fetch capabilities
conflicts: []
blockers:
  - field: execution.site_receipt
    reason: no HPC execution authorized during construction
  - field: validation.thresholds
    reason: thresholds are draft and not frozen from independent calibration
readiness:
  extraction_completeness: ready
  execution_readiness: recoverable
  verification_readiness: recoverable
  benchmark_case_readiness: recoverable
production_readiness:
  status: not_assessed
  owner: mlp
note: Deterministic information-readiness only; no scientific adequacy or benchmark-validity judgment.
