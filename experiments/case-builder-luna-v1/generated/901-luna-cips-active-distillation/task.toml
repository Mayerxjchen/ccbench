schema_version = "1.2"
artifacts = []

[execution]
class = "hpc_controller"

[candidate]
instruction = "instruction.md"
submission_root = "."
legacy_submission_layout = false
files = [{ destination = ".", source = "public/**", strip_prefix = "public" }]

[hpc]
contract_version = "hpc-execution/v1"
required_capabilities = ["batch_jobs", "gpu", "artifact_fetch"]

[hpc.qualification]
requires = ["dispatcher.gpu", "runtime.matclaw-gpu"]

[hpc.scientific_capabilities]
required = ["matclaw-cips"]
optional = ["gpu-training"]

[runtime]
requirements = [{ family = "matclaw-cips", name = "matclaw-cips", version = "==2.2.11" }]

[task]
name = "experiments/901-luna-cips-active-distillation"
description = "Runnable Draft: active teacher-to-student DeePMD distillation for periodic CuInP2S6"
authors = []
keywords = ["matclaw", "cips", "deepmd", "knowledge-distillation", "active-learning", "hpc"]

[metadata]
case_status = "runnable_draft"

[verifier]
timeout_sec = 172800.0

[verifier.env]
MATCLAW_PROFILE = "draft"

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 8
memory_mb = 16384
storage_mb = 51200
gpus = 1
allow_internet = false
mcp_servers = []

[environment.env]

[solution]

[solution.env]

[submission]
# define the public submission contract here
