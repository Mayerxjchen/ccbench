objective: 'Evaluate the published LC-MLP v1 checkpoint on the 24-cluster Lennard-Jones
  descriptor table and reproduce the reported per-atom cohesive-energy metric band
  (paper Table 1: MAE 0.031, RMSE 0.045 eV/atom). This is a model_evaluation case:
  no retraining is implied.'
source_relationship:
  selected: paper_faithful
  allowed:
  - paper_faithful
  - benchmark_adaptation
execution:
  class: local_sandbox
candidate_inputs:
- public/dataset.csv
- public/data-README.md
- public/config.yaml
- public/weights/lc-mlp-v1.txt
- public/system.json
- public/input-manifest.json
source_context:
  allow:
  - experiments/case-builder-luna-v3/materials-clean/paper
  - experiments/case-builder-luna-v3/materials-clean/repo
  - experiments/case-builder-luna-v3/materials-clean/data
  - experiments/case-builder-luna-v3/materials-clean/LICENSE-NOTES.md
  exclude:
  - expected.json
workflow_capabilities:
- hidden_static_accuracy
label_source: published_model
submission_roles:
- student_model
submission:
  root: .
scientific_observables:
- energy_per_atom_eV
validation_sets:
- name: lc-mlp-v1-calibration-24
  owner: candidate_generated
metric_contract:
- name: energy_mae_ev_per_atom
  unit: eV/atom
  operator: <
  threshold: 0.045
- name: energy_rmse_ev_per_atom
  unit: eV/atom
  operator: <
  threshold: 0.06
contract:
  candidate_visible: true
hidden_verification:
  strategy: deferred_release_work
profiles:
  smoke: profiles/smoke.yaml
  formal: profiles/formal.yaml
non_goals:
- retraining the model
- MD or dynamics stability validation
blockers: []
schema_version: 1
category: mlp
case_kind: model_evaluation
case_status: draft
