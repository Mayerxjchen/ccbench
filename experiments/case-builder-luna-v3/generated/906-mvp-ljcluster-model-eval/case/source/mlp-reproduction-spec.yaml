      are NOT in the released file.
  inventory:
    total_frames:
      value: 24
      claim_status: observed
      evidence:
        - ev-dataset
    components:
      - calibration table (descriptor rows LJ-01..LJ-24)
  splits:
    training: the released 24-cluster table is the calibration/training table
    validation: fixed author split
    test: LJ-25..LJ-32 held out by the authors (not released)
