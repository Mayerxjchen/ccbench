    reported_name: LC-MLP v1
    model_family: feed-forward neural network (fixed-feature MLP)
    variant: two-hidden-layer SiLU per-atom energy regressor
    role: evaluation_only
    intended_use: per-atom cohesive-energy prediction for LJ clusters
    evidence:
      - ev-model-arch
      - ev-model-config
  related_models: []

