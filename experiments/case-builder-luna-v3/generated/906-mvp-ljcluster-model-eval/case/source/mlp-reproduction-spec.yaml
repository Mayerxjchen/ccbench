    Cohesive-Energy Prediction for Lennard-Jones Clusters with a Fixed-Feature
    MLP (LC-MLP v1)
  doi: null
  arxiv: null
  journal: synthetic toy ecosystem (v3 skill regression)
  year: 2026
  authors: null
  source_id: paper-001

reproduction_scope:
  target: model_evaluation_only
  includes:
    - published model artifact (checkpoint)
    - fixed descriptor table evaluation
    - model-level metric reproduction against reported band
  excludes:
    - regenerate training dataset
    - retraining or fine-tuning the model
    - downstream MD or dynamics validation
  interpretation:
    claim_status: observed
    evidence:
      - ev-metrics

target:
