objective: 'Evaluate the published LC-MLP v1 checkpoint on the re-serialized 24-cluster
  Lennard-Jones descriptor table: apply the documented standardization, run inference
  per cluster, and check the reproduced model-level metric band against the paper''s
  reported Table-1 range. No retraining is implied.'
source_relationship:
  selected: paper_faithful
  allowed:
  - paper_faithful
  - benchmark_adaptation
execution:
  class: local_sandbox
candidate_inputs:
- re-serialized descriptor table (public/eval-table.csv)
- published toy checkpoint (public/lc-mlp-v1.txt)
- architecture and standardization config (public/eval-config.yaml)
source_context:
  allow:
  - materials/
  exclude:
  - acceptance.json
  - expected.json
workflow_capabilities:
- hidden_static_accuracy
label_source: null
submission_roles:
- evaluated checkpoint copy (role student_model)
- predictions table (role report)
- metric summary (role report)
- local execution receipt (runtime_receipts)
scientific_observables:
- cohesive energy per atom (eV/atom)
- mean absolute error on the public table (eV/atom)
- root mean squared error on the public table (eV/atom)
submission:
  root: .
validation_sets:
- name: lj-holdout-25-32
  owner: verifier_hidden
metric_contract:
- name: mae_ev_per_atom
  unit: eV/atom
  operator: <
  threshold: 0.05
- name: rmse_ev_per_atom
  unit: eV/atom
  operator: <
  threshold: 0.075
contract:
  candidate_visible: false
hidden_verification:
  strategy: 'MLP-V4 hidden static accuracy: the verifier owns the author-retained
    held-out rows LJ-25..LJ-32 (never distributed, never read by the builder under
    the leave-one-out intake contract). Scoring predictions against those targets
    is deferred release work; at L1 the technical chain (identity, provenance, model
    authenticity, lineage, receipts, integrity) is executed and the scientific outcome
    stays marked deferred.'
profiles:
  smoke: profiles/smoke.yaml
  formal: profiles/formal.yaml
non_goals:
- retraining or fine-tuning the model
- regenerating or growing the dataset
- active-learning reconstruction
- dynamics or physical-observable validation
- container builds and HPC submission (local_sandbox only)
blockers:
- id: blk-inference-serialization
  field: implementation.entrypoint
  status: open
  summary: The toy checkpoint serializes a small fixed vector per layer while the
    config describes a width-32 two-hidden-layer FFN; the paper names the file the
    published checkpoint without pinning the exact inference semantics. The executable
    inference contract must be frozen with the source owner before the first formal
    Discovery run; the smoke-class Discovery run executes the technical chain only.
  recovery: author clarification or a version-matched inference script
schema_version: 1
category: mlp
case_kind: model_evaluation
case_status: draft
