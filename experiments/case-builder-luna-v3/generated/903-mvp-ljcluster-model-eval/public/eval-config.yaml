model:
  type: ffn
  cutoff_ang: 6.0
  hidden: [32, 32]
  activation: silu
  features: [n_atoms, r_min_ang, r_max_ang, coord_num_mean, e_distort]
  target: energy_per_atom_eV
preprocessing:
  standardize: true
  train_mean: [-1.0, 3.02, 3.98, 4.9, 0.5]
  train_std: [1.0, 0.08, 0.35, 1.8, 0.3]
training:
  optimizer: adam
  lr: 0.001
  epochs: 200
  seed: 20260903
checkpoint: weights/lc-mlp-v1.txt
