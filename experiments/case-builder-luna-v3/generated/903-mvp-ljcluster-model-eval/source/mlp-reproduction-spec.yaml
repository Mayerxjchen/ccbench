      value: 6.0
      unit: angstrom
      claim_status: observed
      evidence: [ev-cutoff]
    parameters:
      type: ffn
      hidden_layers: [32, 32]
      activation: silu
      features: [n_atoms, r_min_ang, r_max_ang, coord_num_mean, e_distort]
      target: energy_per_atom_eV
      claim_status: observed
      evidence: [ev-model, ev-descriptor]
  precision:
    value: null
    claim_status: unknown
    evidence: []
  initialization:
    standardize: true
    train_mean: [-1.0, 3.02, 3.98, 4.9, 0.5]
    train_std: [1.0, 0.08, 0.35, 1.8, 0.3]
    claim_status: observed
    evidence: [ev-preproc]
  evidence: [ev-model]

