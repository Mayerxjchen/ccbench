validation:
  model_level:
    dataset_or_split:
      value: >-
        fixed author split; held-out rows LJ-25..LJ-32 (8 clusters),
        author-retained and not distributed in the sources
      claim_status: observed
      evidence: [ev-validation, ev-holdout]
    metrics: [mae_ev_per_atom, rmse_ev_per_atom]
    reference_values:
      - metric: mae_ev_per_atom
        value: 0.031
        unit: eV/atom
        claim_status: observed
        evidence: [ev-validation]
      - metric: rmse_ev_per_atom
        value: 0.045
        unit: eV/atom
        claim_status: observed
        evidence: [ev-validation]
    procedure: >-
      run the published checkpoint over the re-serialized descriptor table
      with the recorded standardization, compute per-atom MAE/RMSE against
      reference energies, and compare against the reported Table-1 band.
    evidence: [ev-validation]
  trajectory_level:
    conditions: null
    metrics: []
  property_level:
    observables: [cohesive energy per atom]
    metrics: []

