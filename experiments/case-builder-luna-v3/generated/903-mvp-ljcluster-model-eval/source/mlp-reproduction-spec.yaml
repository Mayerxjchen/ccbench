schema_version: 1

paper:
  title: >-
    Cohesive-Energy Prediction for Lennard-Jones Clusters with a
    Fixed-Feature MLP (LC-MLP v1)
  doi: null
  arxiv: null
  journal: null
  year: 2026
  authors: []
  source_id: paper-001

reproduction_scope:
  target: model_evaluation_only
  includes:
    - run the published LC-MLP v1 checkpoint over the re-serialized descriptor table
    - model-level metric computation (MAE/RMSE per atom)
    - comparison against the reported Table-1 metric band
  excludes:
    - retraining or fine-tuning
    - dataset regeneration or active-learning reconstruction
    - dynamics and physical-observable validation
  interpretation:
    claim_status: observed
    evidence: [ev-scope]

target:
  primary:
    reported_name: LC-MLP v1
    model_family: ffn
    variant: v1
    role: production
    intended_use: >-
      per-atom cohesive-energy prediction for icosahedral/decahedral
      Lennard-Jones clusters; here reproduced as an evaluation target
    evidence: [ev-target]
  related_models: []

system:
  elements: [Ar]
  compositions: ["Arn clusters, n in {8, 13, 19, 27, 38}"]
  phases: [cluster]
  interfaces: []
  charge_states: []
  spin_states: []
  thermodynamic_conditions:
    regime: 0 K static clusters (toy; no ensemble stated)
  chemical_scope:
    - lennard_jones_clusters

dataset:
  scientific_scope:
    systems: [lennard_jones_clusters]
    generation_summary: 24-cluster calibration table (toy ecosystem)
  inventory:
    total_frames:
      value: 24
      claim_status: observed
      evidence: [ev-data]
    components: [LJ-01..LJ-24 calibration rows]
  splits:
    training: published calibration table LJ-01..LJ-24
    validation: null
    test: author-retained held-out rows LJ-25..LJ-32 (not distributed)
  artifact:
    source_id: data-001
    format: csv
    manifest: null
    paths: [materials/data/dataset.csv]
    content_hash: see source/sources.lock.json entry data-001
  data_generation:
    required_for_scope: false
    method: null
    active_learning: null

