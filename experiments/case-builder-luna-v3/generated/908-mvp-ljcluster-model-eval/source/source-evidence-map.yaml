schema_version: 1
sources:
  paper-001:
    source_kind: paper
    title: >-
      Cohesive-Energy Prediction for Lennard-Jones Clusters with a
      Fixed-Feature MLP (LC-MLP v1)
    doi: null
    local_copy: experiments/case-builder-luna-v3/materials/paper/paper.md
    note: >-
      Synthetic toy ecosystem (props-2026-09-03) written for the v3 skill
      regression; internally consistent for a model_evaluation reproduction.
  data-001:
    source_kind: dataset_metadata
    title: 24-cluster LJ calibration table (LJ-01..LJ-24)
    local_copy: experiments/case-builder-luna-v3/materials/data/dataset.csv
    companion_doc: experiments/case-builder-luna-v3/materials/data/README.md
  repo-001:
    source_kind: repository_config
    title: LC-MLP v1 release repository (toy)
    local_copy: experiments/case-builder-luna-v3/materials/repo/config.yaml
  weights-001:
    source_kind: model_artifact
    title: LC-MLP v1 published checkpoint (toy serialization)
    local_copy: experiments/case-builder-luna-v3/materials/repo/weights/lc-mlp-v1.txt
  license-001:
    source_kind: author_documentation
    title: Per-artifact license and access notes
    local_copy: experiments/case-builder-luna-v3/materials/LICENSE-NOTES.md
evidence:
  ev-paper-abstract-metrics:
    source_id: paper-001
    source_kind: paper
    locator:
      file: paper/paper.md
      section: Abstract
    claim: validation.model_level.reference_values
    note: reported MAE 0.031 eV/atom and RMSE 0.045 eV/atom on the reported split
  ev-paper-table1-split:
    source_id: paper-001
    source_kind: paper
    locator:
      file: paper/paper.md
      section: Reported results (Table 1)
    claim: dataset.splits
    note: fixed split; rows LJ-25..LJ-32 held out by the authors
  ev-paper-descriptors:
    source_id: paper-001
    source_kind: paper
    locator:
      file: paper/paper.md
      section: Methods / Descriptors
    claim: dataset.scientific_scope.systems
    note: >-
      five fixed structural descriptors (n_atoms, r_min_ang, r_max_ang,
      coord_num_mean, e_distort); distance-cutoff radius 6.0 angstrom fixes the
      descriptor basis
  ev-paper-model:
    source_id: paper-001
    source_kind: paper
    locator:
      file: paper/paper.md
      section: Methods / Model
    claim: model.architecture
    note: two hidden layers, width 32, SiLU; standardized inputs; target energy_per_atom_eV
  ev-paper-training:
    source_id: paper-001
    source_kind: paper
    locator:
      file: paper/paper.md
      section: Methods / Training
    claim: training
    note: Adam, lr 1e-3, 200 epochs, seed 20260903, 24-cluster calibration table
  ev-config-hyperparameters:
    source_id: repo-001
    source_kind: repository_config
    locator:
      file: repo/config.yaml
    claim: model.architecture.parameters
    note: >-
      model.type ffn; cutoff_ang 6.0; hidden [32, 32]; activation silu;
      feature list and target column; preprocessing train_mean/train_std;
      training optimizer/lr/epochs/seed; checkpoint path
  ev-weights-identity:
    source_id: weights-001
    source_kind: model_artifact
    locator:
      file: repo/weights/lc-mlp-v1.txt
    claim: target.primary
    note: >-
      toy checkpoint of format lc-mlp-toy-v1 (serialized layer/head/bias
      values); identity is by file hash, recorded in source/sources.lock.json
  ev-data-inventory:
    source_id: data-001
    source_kind: dataset_metadata
    locator:
      file: data/dataset.csv
    claim: dataset.inventory
    note: 24 clusters LJ-01..LJ-24 with descriptor columns and energy_per_atom_eV labels
  ev-data-units:
    source_id: data-001
    source_kind: dataset_metadata
    locator:
      file: data/README.md
    claim: labels.energy
    note: >-
      column units and meanings; author's held-out rows LJ-25..LJ-32 are NOT
      in this file; license CC-BY-4.0
  ev-license-states:
    source_id: license-001
    source_kind: author_documentation
    locator:
      file: LICENSE-NOTES.md
    claim: licenses
    note: >-
      repo code/config MIT; dataset and paper CC-BY-4.0; checkpoint license
      unknown (not inferred from the repo license)
conflicts: []
